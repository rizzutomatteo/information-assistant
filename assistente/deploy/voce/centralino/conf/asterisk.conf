; Dove Asterisk trova e scrive i suoi file. Si scrive solo in /run/centralino (in memoria).
[directories]
astetcdir => /run/centralino/conf
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /run/centralino/db
astdbdir => /run/centralino/db
astkeydir => /run/centralino/db
astdatadir => /run/centralino/db
astagidir => /run/centralino/db
astspooldir => /run/centralino/spool
astrundir => /run/centralino/run
astlogdir => /run/centralino/log
astsbindir => /usr/sbin

[options]
; Nei log niente colori e niente data (la aggiunge Docker)
nocolor = yes
