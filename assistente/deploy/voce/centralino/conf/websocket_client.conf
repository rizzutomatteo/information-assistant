; La connessione al server della voce: una per telefonata, con il segreto condiviso
[voce]
type = websocket_client
uri = ${VOCE_URL}
protocols = media
connection_type = per_call_config
connection_timeout = 2000
reconnect_attempts = 1
username = asterisk
password = ${TELEFONO_SEGRETO}
tls_enabled = no
