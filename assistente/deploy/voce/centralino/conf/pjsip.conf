; Il centralino ascolta solo sull'indirizzo della tailnet: il telefono di prova si collega da lì.
; Il numero vero ha un trasporto suo, in pjsip_operatore.conf.
[tailnet]
type = transport
protocol = udp
bind = ${TELEFONO_IP}:5060

; Il telefono di prova: un'app SIP (per esempio Linphone) su un dispositivo della tailnet,
; con utente «prova» e la password di TELEFONO_PASSWORD_PROVA
[prova]
type = endpoint
transport = tailnet
context = da-prova
disallow = all
allow = g722,alaw,ulaw
auth = prova-auth
aors = prova
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

[prova-auth]
type = auth
auth_type = userpass
username = prova
password = ${TELEFONO_PASSWORD_PROVA}

[prova]
type = aor
max_contacts = 1
remove_existing = yes

