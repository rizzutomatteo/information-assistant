; Ogni telefonata va all'assistente, cioè al server della voce: l'audio passa in WebSocket,
; slin16 (PCM 16 bit, 16 kHz). Il server risponde, saluta e ascolta, come per il browser.
[assistente]
exten => s,1,Dial(WebSocket/voce/c(slin16))
; Il server non ha accettato: linee occupate o servizio fermo
 same => n,Busy(5)
 same => n,Hangup()

; Dal telefono di prova, qualunque numero si componga
[da-prova]
exten => _X.,1,Goto(assistente,s,1)

; Dal numero vero (pjsip_operatore.conf)
[da-operatore]
exten => s,1,Goto(assistente,s,1)
exten => _X.,1,Goto(assistente,s,1)

; La prova automatica (README): un chiamante finto dice la domanda registrata in
; /run/centralino/prova/domanda.sln16 (dopo il saluto) e registra la risposta dell'assistente.
; Se c'è il file /run/centralino/prova/pin, prima digita quelle cifre e il cancelletto
[prova-automatica]
exten => s,1,Wait(6)
 same => n,Playback(/run/centralino/prova/domanda)
 same => n,GotoIf($[${STAT(e,/run/centralino/prova/pin)}]?pin)
 same => n(registra),Record(/run/centralino/prova/risposta.wav,0,25,qk)
 same => n,Hangup()
 same => n(pin),Wait(8)
 same => n,SendDTMF(${FILE(/run/centralino/prova/pin)}#)
 same => n,Goto(registra)
