; Il numero vero: Asterisk si registra presso l'operatore VoIP e riceve le sue chiamate.
; Server, utente e password li dà l'operatore dopo l'attivazione: vanno nel file .env
; (OPERATORE_SERVER, OPERATORE_UTENTE, OPERATORE_PASSWORD), con l'indirizzo pubblico del
; server (OPERATORE_IP_PUBBLICO). Senza OPERATORE_UTENTE questo file non si usa.

; Verso internet. Le chiamate entrano dal varco che la registrazione tiene aperto nel firewall
[internet]
type = transport
protocol = udp
bind = 0.0.0.0:5062
external_signaling_address = ${OPERATORE_IP_PUBBLICO}
external_media_address = ${OPERATORE_IP_PUBBLICO}
local_net = 10.0.0.0/8
local_net = 100.64.0.0/10

[operatore]
type = registration
transport = internet
outbound_auth = operatore-auth
server_uri = sip:${OPERATORE_SERVER}
client_uri = sip:${OPERATORE_UTENTE}@${OPERATORE_SERVER}
contact_user = ${OPERATORE_UTENTE}
expiration = 300
retry_interval = 60
forbidden_retry_interval = 600
; Le chiamate in arrivo si riconoscono dalla registrazione, non dall'indirizzo dell'operatore
line = yes
endpoint = operatore

[operatore-auth]
type = auth
auth_type = userpass
username = ${OPERATORE_UTENTE}
password = ${OPERATORE_PASSWORD}

[operatore]
type = aor
contact = sip:${OPERATORE_SERVER}
qualify_frequency = 30

[operatore]
type = endpoint
transport = internet
context = da-operatore
disallow = all
allow = g722,alaw,ulaw
outbound_auth = operatore-auth
aors = operatore
from_user = ${OPERATORE_UTENTE}
from_domain = ${OPERATORE_SERVER}
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
